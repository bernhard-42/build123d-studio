name: Package

# One runner per platform, each assembling only its own package.
#
# Cross-building is avoided deliberately: the macOS bundle needs sips, iconutil
# and hdiutil, the Windows zip needs PowerShell, and the AppImage needs Linux.
# Matching the runner to the target keeps every step native.
#
# uv is not packaged: the application downloads the current release on first
# start, so packages stay small and a bundled uv cannot cap the newest
# installable Python.
#
# Nothing is code-signed. macOS will report an unidentified developer and
# Windows SmartScreen will warn; see the README for what users have to do.
#
# Hardening notes, since this workflow has a job that can write to the repo:
#
#   * Actions are pinned to commit SHAs, not tags. A tag is mutable - whoever
#     controls the action's repository can repoint v4 at new code, and it would
#     run here with whatever permissions the job holds. A SHA cannot be
#     repointed. The trailing comment records which tag each SHA was.
#   * permissions is read-all by default and contents: write is granted only to
#     the release job, which runs no build code of its own. A compromised
#     dependency executing during "yarn install" therefore has a read-only
#     token, not one that can push to the repository.
#   * checkout uses persist-credentials: false, so the token is not left in
#     .git/config where any later step - including a postinstall script - could
#     read it.
#   * Values are passed to run: through env rather than interpolated into the
#     shell. These particular values are matrix entries defined right here, so
#     nothing outside the file can reach them, but "${{ }}" in a run: block is
#     substituted before the shell sees it, and keeping the habit means a later
#     edit that interpolates something attacker-controlled - a branch name, a PR
#     title - does not silently become a shell injection.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # One platform failing should not hide whether the others work.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: yarn

      # No postinstall hook fetches anything any more. The Neutralino binaries
      # that become the application executable are downloaded by package:build's
      # first step and checked against the digests in
      # scripts/neutralino-pin.json before they are used; the client library
      # comes from the @neutralinojs/lib npm package, under yarn.lock's
      # integrity hash. Previously `postinstall: neu update` fetched the
      # binaries with no verification at all, here as well as on developer
      # machines.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build the frontend and Neutralino binaries
        run: yarn package:build

      - name: Assemble the package
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/package.mjs --target "$TARGET"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build123d-studio-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
          if-no-files-found: error

  release:
    name: Attach to release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that can write, and it builds nothing: it downloads the
    # artifacts the packaging jobs produced and attaches them.
    #
    # id-token and attestations are what attest-build-provenance needs to mint a
    # signing certificate and record the attestation. They are granted here and
    # nowhere else, for the same reason contents: write is - this job runs no
    # build code, so nothing from a compromised dependency can reach them.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      # This project checks what it consumes - uv is verified against a
      # committed digest and its provenance against astral-sh/uv's own release
      # workflow - and until now published nothing anyone could check in return.
      # A user downloading a .dmg had no way to tell it apart from one somebody
      # else uploaded.
      #
      # SHA256SUMS.txt is the low-tech half: it detects corruption and lets one
      # download be compared against another. It proves nothing about origin on
      # its own, since whoever could replace the artifacts could replace the
      # sums file beside them.
      # Named by extension rather than "*", which would race with its own
      # redirect over whether the sums file lists itself, and would fail loudly
      # if a platform's artifact were ever missing rather than quietly
      # publishing sums for whatever did arrive.
      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          sha256sum -- *.dmg *.zip *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The half that proves origin. Attestation is minted by GitHub against
      # this workflow's identity and cannot be forged for a file this workflow
      # never produced, so `gh attestation verify <file> --repo <this repo>`
      # answers "did build123d Studio's release workflow build this?" - the same
      # question this project asks of uv before installing it.
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          draft: true
          body: |
            Unsigned builds.

            **macOS** — the first open is blocked as an unidentified developer.
            Right-click the app and choose *Open*, or run
            `xattr -dr com.apple.quarantine "/Applications/build123d Studio.app"`.

            **Windows** — SmartScreen warns on first run: *More info* → *Run anyway*.

            ### Verifying what you downloaded

            These builds are unsigned, but they are attested. Both checks are
            worth more than the warnings above are worth worrying about.

            ```
            # Did this repository's release workflow build it?
            gh attestation verify build123d-studio-*.dmg --repo ${{ github.repository }}

            # Is the download intact?
            shasum -a 256 -c SHA256SUMS.txt --ignore-missing
            ```

            The attestation is the meaningful one: it is minted by GitHub
            against the workflow that produced the file and cannot be forged for
            an artifact that workflow never built. The checksums only detect a
            damaged or truncated download - anyone able to replace the files
            could replace SHA256SUMS.txt with them.

            On first start the application downloads its own Python environment
            (about 500 MB) into your user data directory. On macOS it then loads
            the OCP libraries once, which takes about a minute while the system
            verifies them. Neither happens again.
