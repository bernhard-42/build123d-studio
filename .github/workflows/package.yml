name: Package

# One runner per platform, each assembling only its own package.
#
# Cross-building is avoided deliberately: the macOS bundle needs sips, iconutil
# and hdiutil, the Windows zip needs PowerShell, and the AppImage needs Linux.
# Matching the runner to the target keeps every step native.
#
# uv is not packaged: the application downloads the current release on first
# start, so packages stay small and a bundled uv cannot cap the newest
# installable Python.
#
# Nothing is code-signed. macOS will report an unidentified developer and
# Windows SmartScreen will warn; see the README for what users have to do.
#
# Hardening notes, since this workflow has a job that can write to the repo:
#
#   * Actions are pinned to commit SHAs, not tags. A tag is mutable - whoever
#     controls the action's repository can repoint v4 at new code, and it would
#     run here with whatever permissions the job holds. A SHA cannot be
#     repointed. The trailing comment records which tag each SHA was.
#
#     Every SHA here was resolved from its tag through the GitHub API and then
#     checked by reading runs.using out of that commit's own action.yml, rather
#     than taken from a release note. That is the only way to know what a pin
#     actually runs, and it is the check the Node 20 bump below was made on.
#   * permissions is read-all by default and contents: write is granted only to
#     the release job, which runs no build code of its own. A compromised
#     dependency executing during "yarn install" therefore has a read-only
#     token, not one that can push to the repository.
#   * Node 24. GitHub deprecated Node 20 on the runners, and all five of the
#     JavaScript actions used here were still on it - the warning named only
#     three, because those are the ones in the package job, but download-artifact
#     and action-gh-release would have been flagged on the next run. All five
#     moved together; attest-build-provenance is a composite action with no
#     runtime of its own and is unaffected.
#
#     The jumps are large - checkout v4 to v7, download-artifact v4 to v8 - so
#     every input this file passes was confirmed to still exist at the new
#     commit. Two behaviour changes are worth knowing rather than discovering:
#     download-artifact v8 now *errors* on a digest mismatch instead of warning,
#     which is what this project would have asked for; and setup-node v5 caches
#     automatically when package.json has a packageManager field, which this one
#     does not, and cache: yarn is set explicitly in any case.
#
#   * checkout uses persist-credentials: false, so the token is not left in
#     .git/config where any later step - including a postinstall script - could
#     read it.
#   * Values are passed to run: through env rather than interpolated into the
#     shell. These particular values are matrix entries defined right here, so
#     nothing outside the file can reach them, but "${{ }}" in a run: block is
#     substituted before the shell sees it, and keeping the habit means a later
#     edit that interpolates something attacker-controlled - a branch name, a PR
#     title - does not silently become a shell injection.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # One platform failing should not hide whether the others work.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Labels checked against actions/runner-images before the first tag,
          # because one that no longer resolves means the job never starts and
          # the release job fails with it - on a workflow that had never run.
          # macos-13 has been retired outright and macos-14 is deprecated; the
          # current pair is macos-15 for arm64 and macos-15-intel for x64.
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          # linux-arm64 was supported everywhere except here: scripts/package.mjs
          # has the target, the Neutralino pin carries the binary, appimagetool's
          # aarch64 digest is committed and uv has the triple pinned - but no job
          # ever built it, so the one platform nobody could test was also the one
          # nobody would notice breaking.
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: win32-x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: yarn

      # No postinstall hook fetches anything any more. The Neutralino binaries
      # that become the application executable are downloaded by package:build's
      # first step and checked against the digests in
      # scripts/neutralino-pin.json before they are used; the client library
      # comes from the @neutralinojs/lib npm package, under yarn.lock's
      # integrity hash. Previously `postinstall: neu update` fetched the
      # binaries with no verification at all, here as well as on developer
      # machines.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build the frontend and Neutralino binaries
        run: yarn package:build

      # shell: bash on every platform, because "$TARGET" is bash syntax and the
      # Windows runners default to PowerShell, where the variable is $env:TARGET
      # - so it expanded to nothing and the packager was asked for target "".
      # Naming the shell keeps the env-var habit above working everywhere
      # rather than interpolating ${{ }} into a command line.
      - name: Assemble the package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: node scripts/package.mjs --target "$TARGET"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build123d-studio-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/studio
          if-no-files-found: error

  release:
    name: Attach to release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that can write, and it builds nothing: it downloads the
    # artifacts the packaging jobs produced and attaches them.
    #
    # id-token and attestations are what attest-build-provenance needs to mint a
    # signing certificate and record the attestation. They are granted here and
    # nowhere else, for the same reason contents: write is - this job runs no
    # build code, so nothing from a compromised dependency can reach them.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      # The release notes are a file in the repository, and this job otherwise
      # checks nothing out - it only downloads what the packaging jobs built.
      # Without this, body_path finds nothing and action-gh-release publishes an
      # empty body without complaining, which is what v0.4.2 shipped with.
      #
      # Sparse, and blobless: one file is wanted, and this job holds the only
      # write token in the workflow. The less of the repository is on that
      # machine, the less there is to go wrong there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            FirstRun.md
            CHANGELOG.md
          sparse-checkout-cone-mode: false
          filter: blob:none

      # What changed, above how to verify what you downloaded. The newest
      # section only - everything from the first "## " heading to the next -
      # because a release page is about this release and the rest is one click
      # away in the file.
      #
      # `test -s` is the guard, and it is here because the failure it catches
      # has happened: action-gh-release publishes an empty body without
      # complaining, which is what v0.4.2 shipped with when this job had no
      # checkout at all. A release with no notes should fail the job instead.
      - name: Build the release notes
        run: |
          set -euo pipefail
          awk '/^## /{ n++ } n == 1' CHANGELOG.md > notes.md
          printf '\n---\n\n' >> notes.md
          cat FirstRun.md >> notes.md
          test -s notes.md
          head -3 notes.md

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # This project checks what it consumes - uv is verified against a
      # committed digest and its provenance against astral-sh/uv's own release
      # workflow - and until now published nothing anyone could check in return.
      # A user downloading a .dmg had no way to tell it apart from one somebody
      # else uploaded.
      #
      # SHA256SUMS.txt is the low-tech half: it detects corruption and lets one
      # download be compared against another. It proves nothing about origin on
      # its own, since whoever could replace the artifacts could replace the
      # sums file beside them.
      # Named by extension rather than "*", which would race with its own
      # redirect over whether the sums file lists itself, and would fail loudly
      # if a platform's artifact were ever missing rather than quietly
      # publishing sums for whatever did arrive.
      # Attached as a file *and* read into the release notes: checking a
      # download should not begin with downloading a second file.
      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          sha256sum -- *.dmg *.zip *.AppImage studio > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The half that proves origin. Attestation is minted by GitHub against
      # this workflow's identity and cannot be forged for a file this workflow
      # never produced, so `gh attestation verify <file> --repo <this repo>`
      # answers "did build123d Studio's release workflow build this?" - the same
      # question this project asks of uv before installing it.
      #
      # Skipped while the repository is private, because GitHub refuses to
      # persist attestations for user-owned private repositories: "Feature not
      # available… please make this repository public". Without this condition
      # that refusal fails the job and no release is published at all, which
      # trades the whole release for the half of the verification that cannot
      # work yet. It starts working by itself the day the repository goes
      # public - and the release notes below say which of the two checks a given
      # release actually carries, rather than promising both.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/studio

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*
          # Published, not drafted. A draft's assets are private - the browser
          # can fetch them because it carries a session, `curl` gets a 404 - and
          # its URL stays `untagged-<hash>` however real the tag is, so every
          # link handed to anyone before someone remembers to press Publish is a
          # link that does not work.
          draft: false
          # The notes are this release's CHANGELOG section followed by
          # FirstRun.md, both verbatim from the repository. Prose buried in this
          # file is prose nobody edits - it went a week saying "Unsigned builds"
          # after macOS builds started being signed - and a file at the top of
          # the repository is reviewed like anything else. The checksums stay in
          # SHA256SUMS.txt, which is attached beside the packages and which the
          # notes tell the reader to compare against.
          body_path: notes.md
