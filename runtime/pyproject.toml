[project]
name = "build123d-studio-runtime"
version = "0.1.0"
description = "Encapsulated Python environment for the build123d-studio application"
requires-python = "==3.14.*"

dependencies = [
    # --- frozen: moves only when the application is rebuilt and retested ---
    "ocp_vscode==4.0.1",
    "ipykernel==7.3.0",
    "jupyter_client==8.9.1",
    "jupyter_console==6.6.3",
    "prompt_toolkit==3.0.53",
    "pyzmq==27.1.0",
    "orjson==3.11.9",
    "websockets==16.1.1",
    "pywinpty==3.0.5; sys_platform == 'win32'",
    "basedpyright==1.39.9",
    "black==26.5.1",

    # --- floating: moved by "Upgrade packages", within this range ---
    "build123d>=0.11.1",
]

# This project exists only to pin an environment - there is no package to build.
[tool.uv]
package = false
