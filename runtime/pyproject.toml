[project]
name = "build123d-studio-runtime"
version = "0.1.0"
description = "Encapsulated Python environment for the build123d-studio application"
requires-python = "==3.14.*"

dependencies = [
    # --- frozen: moves only when the application is rebuilt and retested ---
    #
    # The shared show pipeline. ocp-tessellate arrives under it.
    "ocp-viewer-core==1.0.0",
    # Brings ipykernel, jupyter_client, prompt_toolkit, pyzmq and ipython -
    # bumping this one moves them all, at versions its author reconciled.
    "jupyter_console==6.6.3",
    "orjson==3.11.9",
    "websockets==16.1.1",
    "pywinpty==3.0.5; sys_platform == 'win32'",
    "basedpyright==1.39.9",
    "ruff==0.16.3",

    # --- floating: moved by "Upgrade packages", within this range ---
    "build123d>=0.11.1",
]

# This project exists only to pin an environment - there is no package to build.
[tool.uv]
package = false
